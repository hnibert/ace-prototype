#General
title: Alaska Climate & Ecosystem Dashboard
email: jlee@noaa.gov
description: >-
  Alaska’s fisheries and marine ecosystems are changing as the climate shifts, bringing new challenges for 
  resource managers, fishing communities, and decision-makers. We are working to provide people with tools and information that 
  supports decision-making as we navigate these changing conditions.
baseurl: "/ace-prototype" # the subpath of your site, e.g. /ace-prototype 
url: "https://hnibert.github.io" # the base hostname & protocol for your site, e.g. http://example.com 
#twitter_username: ""
#github_username:  ""

#Socials Links (add share URL to show link in posts 'share' sections)
socials:
 - title: GitHub
   icon: fa-brands fa-github
   share_url: null
   url: https://github.com/hnibert/ace-prototype

 - title: Instagram
   icon: fa-brands fa-instagram
   share_url: null
   url: null

 - title: Facebook
   icon: fa-brands fa-facebook
   share_url: https://www.facebook.com/sharer/sharer.php?u=
   url: null


#Newsletter
#...

#Timezone
#Jekyll will calculate all post times relative to this specific timezone at build time
timezone: America/Los_Angeles

#Collections
collections:
  people:
    output: true
    permalink: /:collection/:slug/
  regions:
    output: true
    permalink: /:collection/:slug/
    sort_by: display_order #sort by the front matter field 'display_order'
  communities:
    output: true
    permalink: /:collection/:slug/
    sort_by: display_order #sort by the front matter field 'display_order'
  species:
    output: true
    permalink: /:collection/:slug/
  tools:
    output: true
    permalink: /:collection/:slug/

#Posts 'Type' Permalink Configs
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: /news/:title/
  - scope:
      path: "resources"
    values:
      permalink: /resources/:title/

#Jekyll Archives Configs
jekyll-archives:
  enabled: [year, month, categories]
  layout: 'archive' #All archives use _layouts/archive.html
  permalinks:
    year: '/news/archives/:year/'
    month: '/news/archives/:year/:month/'
    category: '/news/archives/:name/'

#Minify any styles
sass:
  style: compressed

#Build Settings
theme: null
plugins:
  - jekyll-feed
  - jekyll-archives
  - jekyll-seo-tag

