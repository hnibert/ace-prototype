logo:
  src: ..\assets\images\logos\ace-logo-md.png
  show_in_header: true
  
backend:
  name: git-gateway
  repo: hnibert/ace-prototype
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/96d2cc92-6eff-4b19-8f9a-19200c0bcf89/pkce
  auth_token_endpoint: /sites/96d2cc92-6eff-4b19-8f9a-19200c0bcf89/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Content update from {{author-name}} via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Media
media_folder: "/assets/images/media" # Where media files will be saved
public_folder: "/assets/images/media" # Where Jekyll serves media files

#Allow editorial workflows
publish_mode: editorial_workflow

#Local read/write (true if testing locally, false otherwise)
#local_backend: true

#Linked Collections
collections:
  # ============
  #  RESOURCE TAGS (SITE DATA)
  # ============
  - name: "global_data"
    label: "Global Data"
    delete: false
    editor: { preview: false }
    files:

      # Resource Type
      - name: "resource_types"
        label: "Resource Types"
        file: "_data/tags/resource_types.yml"
        fields:
          - name: "items"
            label: "Resource Types"
            widget: "list"
            summary: "{{label}} ({{id}})"
            fields:
              - { name: "id", label: "ID Slug", widget: "string" }
              - { name: "label", label: "Display Label", widget: "string" }

      # Theme
      - name: "resource_themes"
        label: "Resource Themes"
        file: "_data/tags/resource_themes.yml"
        fields:
          - name: "items"
            label: "Resource Themes"
            widget: "list"
            summary: "{{label}} ({{id}})"
            fields:
              - { name: "id", label: "ID Slug", widget: "string" }
              - { name: "label", label: "Display Label", widget: "string" }

      # Species
      - name: "resource_species"
        label: "Resource Species"
        file: "_data/tags/resource_species.yml"
        fields:
          - name: "items"
            label: "Resource Species"
            widget: "list"
            summary: "{{label}} ({{id}})"
            fields:
              - { name: "id", label: "ID Slug", widget: "string" }
              - { name: "label", label: "Display Label", widget: "string" }

      # Subtopics
      - name: "resource_subtopics"
        label: "Resource Subtopics"
        file: "_data/tags/resource_subtopics.yml"
        fields:
          - name: "items"
            label: "Resource Subtopics"
            widget: "list"
            summary: "{{label}} ({{id}})"
            fields:
              - { name: "id", label: "ID Slug", widget: "string" }
              - { name: "label", label: "Display Label", widget: "string" }
              
      # Audiences
      - name: "resource_audiences"
        label: "Resource Audiences"
        file: "_data/tags/resource_audiences.yml"
        fields:
          - name: "items"
            label: "Resource Audiences"
            widget: "list"
            summary: "{{label}} ({{id}})"
            fields:
              - { name: "id", label: "ID Slug", widget: "string" }
              - { name: "label", label: "Display Label", widget: "string" }

      # User Goals
      - name: "resource_goals"
        label: "Resource Goals"
        file: "_data/tags/resource_goals.yml"
        fields:
          - name: "items"
            label: "Resource Goals"
            widget: "list"
            summary: "{{label}} ({{id}})"
            fields:
              - { name: "id", label: "ID Slug", widget: "string" }
              - { name: "label", label: "Display Label", widget: "string" }

  # ============
  #  POSTS (COLLECTION)
  # ============
  - name: "posts"
    label: "Posts"
    folder: "_posts/"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      #Hidden
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }

      #General
      - { label: "Type", name: "type", widget: "select", options: ["Announcement", "Blog", "Story", "Meet the Scientist", "News"] }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }

      - { 
          label: 'Region',
          name: 'region',
          widget: 'relation',
          collection: 'regions',
          display_fields: ["region_name"],
          search_fields: ["region_name"],
          value_field: "{{slug}}"
        }
      
      #Main Image
      - { label: "Image", name: "main_img_url", widget: "image", required: false }
      - { label: "Image Alt Text", name: "main_img_alt", widget: "string", required: false }
      - { label: "Image Caption", name: "main_img_caption", widget: "string", required: false }
      
      #Publishing Dates
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Updated", name: "updated", widget: "datetime" }

      #Categories
      - { label: "Categories", name: "categories", widget: "list", field: { name: "item", widget: "string" }, required: false }

      #Content Flags
      - { label: "Is Featured?", name: "featured", widget: "boolean", default: false }
      - { label: "Is Highlight?", name: "highlight", widget: "boolean", default: false }
      - { label: "Show Read Time?", name: "show_read_time", widget: "boolean", default: true }
      - { label: "Show Related Posts?", name: "show_related_posts", widget: "boolean", default: true }
      
      #Author
      - { 
          label: 'Author',
          name: 'author',
          widget: 'relation',
          collection: 'people',
          display_fields: ["full_name"],
          search_fields: ["full_name"],
          value_field: "{{slug}}"
        }

      #More Information Links
      - { 
          label: 'Information Links',
          name: 'information_links',
          widget: 'list',
          summary: '{{fields.title}}',
          fields: [
            { label: 'Link Title', name: 'title', widget: 'string' },
            { label: 'URL / Path', name: 'url', widget: 'string' }
          ]
        }           
      
      #Post Series
      - { label: "Post Series", name: "post_series", widget: "string", required: false }
      - { label: "Series Order", name: "series_order", widget: "number", value_type: "int", required: false }
      
      #Content
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # ============
  #  PEOPLE (COLLECTION)
  # ============
  - name: "people"
    label: "People"
    folder: "_people"
    create: true
    identifier_field: "full_name"
    slug: "{{full_name}}"
    summary: '{{fields.full_name}}'
    fields:
      #Hidden
      - { label: "Layout", name: "layout", widget: "hidden", default: "person" }

      #Name
      - { label: "Full Name", name: "full_name", widget: "string", required: true }

      #Profile Picture
      - { label: "Image", name: "main_img_url", widget: "image", required: false }
      - { label: "Image Alt Text", name: "main_img_alt", widget: "string", required: false }

      #General Info
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "position", name: "position", widget: "string" }
      - { label: "Affiliation", name: "affiliation", widget: "string" }

      - { 
          label: "Research Areas", 
          name: "research_areas", 
          widget: "select",
          multiple: true,
          options: ["Fisheries Management", "Ecology", "Modeling", "Stock Assessment", "Fishing Communities", "Climate Science", "Communications", "Social Sciene", "Ecosystem-based Research", "Oceanography", "Communications"],
          required: false 
        }

      - { label: "ACE Role", name: "ace_role", widget: "select", options: ["Team", "Contributor"], required: true }

      #Projects
      - { 
          label: 'Projects',
          name: 'projects',
          widget: 'list',
          summary: '{{fields.title}}',
          fields: [
            { label: 'Title', name: 'title', widget: 'string' },
            { label: 'Role', name: 'role', widget: 'string' }
          ]
        }  
      
      #Social Links
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "GitHub", name: "github", widget: "string", required: false }
      - { label: "Scholar", name: "scholar", widget: "string", required: false }
      - { label: "Bluesky", name: "bluesky", widget: "string", required: false }
      - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
      - { label: "Orcid", name: "orcid", widget: "string", required: false }

      #Feature
      - { label: "Is Featured?", name: "featured", widget: "boolean", default: false }
      - { label: "Featured Order", name: "feature_order", widget: "number", value_type: "int", required: false }

      #Content
      - { label: "Short Text", name: "short_text", widget: "text", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  # ============
  #  SPECIES (COLLECTION)
  # ============
  - name: "species"
    label: "Species"
    folder: "_species"
    create: true
    identifier_field: "species_name"
    slug: "{{species_name}}"
    summary: '{{fields.species_name}}'
    fields:
      #Hidden
      - { label: "Layout", name: "layout", widget: "hidden", default: "species" }

      #Image
      - { label: "Image", name: "img_url", widget: "image", required: false }
      - { label: "Image Alt Text", name: "img_alt", widget: "string", required: false }

      #General
      - { label: "Species Name", name: "species_name", widget: "string", required: true }
      - { label: "Scientific Name", name: "scientific_name", widget: "string", required: false }
      - { label: "Other Names", name: "other_names", widget: "text", required: false }

      #Management
      - { label: "Management Structure", name: "management_structure", widget: "string", required: false }
      - { label: "Management Bodies", name: "management_bodies", widget: "list", required: false }
      - { label: "Management Body Notes", name: "management_body_notes", widget: "text", required: false }

      #CDQ Community Development Group(s)
      - { label: "CDQ Groups", name: "cdq_groups", widget: "list", required: false }
      - { label: "CDQ Communities", name: "cdq_communities", widget: "list", required: false }

      #Climate Change Vulnerability
      - { label: "CCV Label", name: "ccv_label", widget: "string", required: false }
      - { label: "CCV Reference", name: "ccv_reference", widget: "string", required: false }
      - { label: "CCV Score", name: "ccv_score", widget: "number", value_type: "int", min: 0, max: 100, required: false }
      - { label: "CCV Notes", name: "ccv_notes", widget: "text", required: false }

      #Data Tags (used in search)
      #TODO: Link to collection of species tags with relation widget
      - { label: "Tags", name: "tags", widget: "list", required: false }
      
      #Communities (used in search)
      - { 
          label: 'Communities',
          name: 'communities',
          widget: 'relation',
          collection: 'communities',
          display_fields: [community_name],
          search_fields: [community_name],
          value_field: "{{slug}}",
          required: false
        }

      #Protections
      - { label: "Protections", name: "protections", widget: "text", required: false }
      - { label: "Protection Notes", name: "protection_notes", widget: "text", required: false }

      #Justification for Classification
      - { label: "Justification for Classification", name: "justification", widget: "text", required: false }
      - { label: "Justification Notes", name: "justification_notes", widget: "text", required: false }

      #Cultural Significance
      - { label: "Cultural Significance", name: "cultural_significance", widget: "text", required: false }
      - { label: "Cultural Significance Notes", name: "cultural_significance_notes", widget: "text", required: false }

      #Spatial Data
      - { label: "Spatial Data", name: "spatial_data", widget: "text", required: false }
      - { label: "Spatial Data Notes", name: "spatial_data_notes", widget: "text", required: false }

      #Is this a species of concern?
      - { label: "Is Species of Concern?", name: "is_species_of_concern", widget: "boolean", default: false }

      #Refernces
      - {
          label: "References",
          name: "references",
          widget: "list",
          field: {
            label: "Citation HTML Structure",
            name: "citation",
            widget: "text"
          }
        }

  # ============
  #  REGIONS (COLLECTION)
  # ============
  - name: "regions"
    label: "Regions"
    folder: "_regions"
    create: true
    identifier_field: "region_name"
    slug: "{{region_name}}"
    summary: '{{fields.region_name}}'
    fields:
      #Hidden
      - { label: "Layout", name: "layout", widget: "hidden", default: "region" }

      #General
      - { label: "Region Name", name: "region_name", widget: "string" }

      #Hero
      - label: "Hero"
        name: "hero_Data"
        widget: "object"
        fields:
          - { label: "ID", name: "id", widget: "string", required: false }
          - { name: "is_header", widget: "hidden", default: "true", meta: true }
          - { label: "Hero Image", name: "img_url", widget: "image", required: false }
          - { label: "Hero Image Alt Text", name: "img_alt", widget: "string", required: false }
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Lead", name: "lead", widget: "text", required: false }

      #Summary
      - { label: "Summary Image", name: "summary_img_url", widget: "image", required: false }
      - { label: "Summary Image Alt Text", name: "summary_img_alt", widget: "string", required: false }
      - { label: "Summary Title", name: "summary_title", widget: "string", required: false }
      - { label: "Summary Lead", name: "summary_lead", widget: "text", required: false }
      
      #Point(s) of Contact
      - { 
          label: 'Point(s) of Contact',
          name: 'points_of_contact',
          widget: 'relation',
          collection: 'people',
          display_fields: ["full_name"],
          search_fields: ["full_name"],
          value_field: "{{slug}}",
          multiple: true,
          required: false
        }

      #Display/Rendering
      - { label: "Display Order", name: "display_order", widget: "number", min: 0, value_type: "int" }

  #Communities (Collection)
  - name: "communities"
    label: "Communities"
    folder: "_communities"
    create: true
    identifier_field: "community_name"
    slug: "{{community_name}}"
    summary: '{{fields.community_name}}'
    fields:
      #Hidden
      - { label: "Layout", name: "layout", widget: "hidden", default: "community" }

      #General
      - { label: "Community Name", name: "community_name", widget: "string", required: true }
      
      #Info Bar
      - { label: "Show Info Bar?", name: "show_info_bar", widget: "boolean", default: false, required: false }
      - { label: "Native Name", name: "native_name", widget: "string", required: false }
      - { label: "Native Pronunciation", name: "native_pronunciation", widget: "string", required: false }
      
      #Pronunciation Audio
      - {
          label: "Pronunciation Audio",
          name: "native_pronunciation_audio",
          widget: "file",
          media_folder: "/assets/audio/pronunciation",
          public_folder: "/assets/audio/pronunciation"
        }

      #Hero
      - label: "Hero"
        name: "hero_Data"
        widget: "object"
        fields:
          - { label: "ID", name: "id", widget: "string", required: false }
          - { name: "is_header", widget: "hidden", default: "true", meta: true }
          - { label: "Hero Image", name: "img_url", widget: "image", required: false }
          - { label: "Hero Image Alt Text", name: "img_alt", widget: "string", required: false }
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Lead", name: "lead", widget: "text", required: false }

      #Summary
      - { label: "Summary Image", name: "summary_img_url", widget: "image", required: true }
      - { label: "Summary Image Alt Text", name: "summary_img_alt", widget: "string", required: false }
      - { label: "Summary Title", name: "summary_title", widget: "string", required: true }
      - { label: "Summary Lead", name: "summary_lead", widget: "text", required: true }

      #Calendar - General
      - { label: "Calendar Summary", name: "calendar_summary", widget: "text", required: false }
      - { label: "Calendar About", name: "calendar_about", widget: "text", required: false }
      - { label: "Calendar Subtitle", name: "calendar_subtitle", widget: "string", required: false }

      #Calendar - Images
      - { label: "Calendar Card Image URL", name: "calendar_card_img_url", widget: "image", required: false }
      - { label: "Calendar Card Image Alt Text", name: "calendar_card_img_alt", widget: "string", required: false }  

      - { label: "Calendar Display Image URL", name: "calendar_display_img_url", widget: "image", required: false }
      - { label: "Calendar Display Image Alt Text", name: "calendar_display_alt", widget: "string", required: false }  

      #Calendar - Downloads
      - {
          label: "Calendar File Download",
          name: "calendar_download_url",
          widget: "file",
          media_folder: "/assets/images/calendars",
          public_folder: "/assets/images/calendars", 
          required: false
        }
        
      - { label: "Calendar File Size", name: "calendar_file_size", widget: "string", required: false } 

      #Point(s) of Contact
      - { 
          label: 'Point(s) of Contact',
          name: 'points_of_contact',
          widget: 'relation',
          collection: 'people',
          display_fields: ["full_name"],
          search_fields: ["full_name"],
          value_field: "{{slug}}",
          multiple: true,
          required: false
        }

      #Display/Rendering
      - { label: "Display Order", name: "display_order", widget: "number", min: 0, value_type: "int", required: false }

  # ============
  #  SITE DATA
  # ============
  - name: "site_data"
    label: "Site Data"
    delete: false #don't allow site data to be deleted from Decap
    files:
      # ============
      #  NAVIGATION (SITE DATA)
      # ============
      - name: "navigation"
        label: "Navigation & Footer"
        file: "_data/navigation.yml"
        fields:
          #Brand
          - name: "brand"
            label: "Brand"
            widget: "object"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "url", label: "URL", widget: "string" }

          #Global Navbar
          - name: "navbar"
            label: "Navbar Links"
            widget: "list"
            fields:
              - { name: "title", label: "Link Title", widget: "string" }
              - { name: "url", label: "URL Path", widget: "string" }
              - name: "dropdown"
                label: "Dropdown Items"
                widget: "list"
                required: false
                types:
                  - name: "standard_link"
                    label: "Standard Link"
                    widget: "object"
                    fields:
                      - { name: "title", label: "Title", widget: "string" }
                      - { name: "url", label: "URL", widget: "string" }
                  - name: "collection_reference"
                    label: "Collection Reference"
                    widget: "object"
                    fields:
                      - { name: "collection", label: "Collection Name", widget: "string" }
                  - name: "menu_divider"
                    label: "Menu Divider"
                    widget: "object"
                    fields:
                      - { name: "divider", label: "Is Divider?", widget: "boolean", default: true }

          #Footer
          - name: "footer"
            label: "Footer Categories"
            widget: "list"
            fields:
              - { name: "title", label: "Category Title", widget: "string" }
              - name: "links"
                label: "Links"
                widget: "list"
                fields:
                  - { name: "title", label: "Link Title", widget: "string" }
                  - { name: "url", label: "URL Path", widget: "string" }
                  
      # ============
      #  RESOURCES (SITE DATA)
      # ============
      - name: "resources"
        label: "Resources"
        file: "_data/resources.yml"
        editor: { preview: false }
        fields:
          - label: "Resource"
            name: "entries"
            widget: "list"
            summary: '{{fields.title}} ({{fields.type}})'
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }

              #Resource Type
              - {
                  label: 'Resource Type',
                  name: 'type',
                  widget: 'relation',
                  collection: 'global_data',
                  file: 'resource_types', 
                  value_field: 'items.*.id',
                  display_fields: ['items.*.label'], 
                  search_fields: ['items.*.id', 'items.*.label'],
                  multiple: false,
                  required: true
                }

              - { label: "Icon Class", name: "icon", widget: "string", required: false }
              - { label: "Resource URL", name: "url", widget: "string", required: true }
              - { label: "Is Available", name: "is-available", widget: "boolean", default: true }
              - { label: "File Attachment", name: "file", widget: "file", required: false, default: null }
              - { label: "Description", name: "description", widget: "text" }
              
              #Regions
              - { 
                  label: 'Regions',
                  name: 'regions',
                  widget: 'relation',
                  collection: 'regions',
                  display_fields: [region_name],
                  search_fields: [region_name],
                  value_field: "{{slug}}",
                  multiple: true,
                  required: false
                }     
                         
              #Communities
              - { 
                  label: 'Communities',
                  name: 'communities',
                  widget: 'relation',
                  collection: 'communities',
                  display_fields: [community_name],
                  search_fields: [community_name],
                  value_field: "{{slug}}",
                  multiple: true,
                  required: false
                }   
                
              #Themes
              - { 
                  label: 'Themes',
                  name: 'themes',
                  widget: 'relation',
                  collection: 'global_data',
                  file: 'resource_themes',
                  value_field: 'items.*.id',
                  display_fields: ['items.*.label'],
                  search_fields: ['items.*.id', 'items.*.label'],
                  multiple: true,
                  required: false
                } 

              #Search Species (Broad Species Search i.e 'cod' or 'crab')
              - { 
                  label: 'Species',
                  name: 'search_species',
                  widget: 'relation',
                  collection: 'global_data',
                  file: 'resource_species',
                  value_field: 'items.*.id',
                  display_fields: ['items.*.label'],
                  search_fields: ['items.*.id', 'items.*.label'],
                  multiple: false, 
                  required: false
                } 

              #Species
              - { 
                  label: 'Species',
                  name: 'species',
                  widget: 'relation',
                  collection: 'global_data',
                  value_field: 'items.*.id',
                  display_fields: ['items.*.label'],
                  search_fields: ['items.*.id', 'items.*.label'],
                  multiple: true,
                  required: false
                } 

              #Audience
              - { 
                  label: 'Audience',
                  name: 'audience',
                  widget: 'relation',
                  collection: 'global_data',
                  file: 'resource_audiences',
                  value_field: 'items.*.id',
                  display_fields: ['items.*.label'],
                  search_fields: ['items.*.id', 'items.*.label'],
                  multiple: true,
                  required: false
                } 

              #Subtopics
              - { 
                  label: 'Subtopics',
                  name: 'subtopics',
                  widget: 'relation',
                  collection: 'global_data',
                  file: 'resource_subtopics',
                  value_field: 'items.*.id',
                  display_fields: ['items.*.label'],
                  search_fields: ['items.*.id', 'items.*.label'],
                  multiple: true,
                  required: false
                } 

              #Authors
              - { 
                  label: 'Authors',
                  name: 'authors',
                  widget: 'relation',
                  collection: 'people',
                  display_fields: [full_name],
                  search_fields: [full_name],
                  value_field: "{{slug}}",
                  multiple: true,
                  required: false
                }   

              #User Goals
              - { 
                  label: 'User Goals',
                  name: 'user-goals',
                  widget: 'relation',
                  collection: 'global_data',
                  file: 'resource_goals',
                  value_field: 'items.*.id',
                  display_fields: ['items.*.label'],
                  search_fields: ['items.*.id', 'items.*.label'],
