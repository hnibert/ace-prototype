    title: Ensemble Projections of Future Climate Change Impacts on the Eastern
      Bering Sea Food Web Using a Multispecies Size Spectrum Model
    icon: fa fa-book
    type: publication
    species:
      - multiple
    file: null
    description: This study shows that eastern Bering Sea food webs are projected to
      lose biomass, catches, and body size under climate change,  and that
      uncertainty in these forecasts is driven mainly by climate variability in
      the near term and by differences among climate and  ecosystem models in
      the long term.
