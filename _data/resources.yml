    title: The collapse of eastern Bering Sea snow crab
    icon: fa fa-book
    type: publication
    species:
      - crab
    file: null
    description: Snow crab populations in the eastern Bering Sea collapsed after
      2018, reaching record lows in 2021. A 2018–2019 heatwave likely triggered
      starvation by boosting energy needs  while shrinking habitat and reducing
      food availability. The loss is among the largest warming-driven die-offs
      of a mobile marine species, with major ecological and economic
      consequences  for the marine food web and the snow crab fishing industry.
