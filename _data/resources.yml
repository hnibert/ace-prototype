    title: Bottom–Up Impacts of Forecasted Climate Change on the Eastern Bering Sea
      Food Web
    icon: fa fa-book
    type: publication
    species:
      - multiple
    file: null
    description: "This study uses climate and food web models to show that
      climate-driven declines in plankton are likely to slowly reduce fish,
      crab,  and other marine species in the eastern Bering Sea through the end
      of the century, with fisheries management influencing outcomes
      but  climate impacts spreading through the entire food web. "
