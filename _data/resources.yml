    description: Ecosystem models of Gulf of Alaska groundfish suggest that catch
      caps could help meet food-security and management goals. However, current
      caps have never been limiting  and likely won’t under climate change and
      continued low predator harvest. This points to a need for
      climate-responsive, ecosystem-wide caps that reflect predator–prey
      dynamics  and are regularly reviewed.
