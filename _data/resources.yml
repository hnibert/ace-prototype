    title: Identifying and reducing climate uncertainty in fisheries management
      reference points
    icon: fa fa-book
    type: publication
    species:
      - crab
    file: null
    description: A new study combining environmental and economic factors into
      models predicts how ocean acidification and rising temperatures will
      affect North Pacific crab populations,  highlighting key stages like
      juvenile growth and larval survival as most sensitive to climate stress,
      and suggesting that harvest limits may need to be adjusted to
      protect  these species as stock assessments currently overlook climate
      change effects.
