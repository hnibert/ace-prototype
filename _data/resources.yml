    title: "Evaluating the impact of climate and demographic variation on future
      prospects for fish stocks: An application for northern rock sole in
      Alaska"
    icon: fa fa-book
    type: publication
    species:
      - rock-sole
    file: null
    description: This study shows that adding climate and environmental factors such
      as temperature, cold pool extent,  and ocean pH to stock assessment models
      for northern rock sole in the Eastern Bering Sea does not greatly
      change  past estimates of population size or fishing pressure, but it can
      strongly affect future management targets, limits,  and harvest
      projections under climate change.
