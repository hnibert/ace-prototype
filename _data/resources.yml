    url: https://doi.org/10.1093/icesjms/fsaf127
    title: Socioeconomic risk of coastal Alaskan fishing communities to
      climate-driven changes in Pacific cod distributions
    icon: fa fa-book
    type: publication
    species:
      - pacific-cod
    file: null
    description: Climate-driven shifts in the distribution of Pacific cod in the
      Eastern Bering Sea threaten the economic and food security of
      fishing-reliant communities,  particularly in the southern Eastern Bering
      Sea. This  highlights the need for adaptive, place-specific fisheries
      management in response to climate change.  We apply a risk assessment
      framework integrated with statistical modelling and regionally downscaled
      ocean models to hindcast and project the distribution of adult  and
      juvenile Pacific cod abundance in the Eastern Bering Sea.
