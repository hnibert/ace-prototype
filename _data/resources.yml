    title: Ecosystem-based fisheries management forestalls climate-driven collapse
    icon: fa fa-book
    type: publication
    species:
      - multiple
    file: null
    description: Climate change threatens fisheries and food security, and this
      study shows that ecosystem-based fisheries management can slow declines in
      eastern Bering Sea fisheries  in the near term, but under high emissions
      many pollock and Pacific cod fisheries collapse after mid-century as
      warming passes a critical temperature threshold.
