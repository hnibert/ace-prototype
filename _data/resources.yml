  #Resource
- title: "Evaluation of a coupled ocean and sea-ice model (MOM6-NEP10k) over the Bering Sea and its sensitivity to turbulence decay scales"
  date: 2025-10-23
  type: "publication"
  icon: "fa fa-book"
  regions:
  - "eastern-bering-sea"
  communities: []
  themes:
