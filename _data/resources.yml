    title: Unintended consequences of climate-adaptive fisheries management targets
    icon: fa fa-book
    type: publication
    species:
      - crab
    file: null
    description: Using maximum sustainable yield (MSY) or MSY based targets that are
      adapted to climate change for fisheries management yield worse
      conservation outcomes than the status quo.  New management tools that go
      beyond MSY are needed to balance conservation and food production as
      climate impacts worsen.
