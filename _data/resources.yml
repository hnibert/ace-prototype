    url: https://academic.oup.com/icesjms/article/82/1/fsae034/7637371
    title: Development of climate informed management scenarios for fisheries in the
      eastern Bering Sea
    icon: fa fa-book
    type: publication
    species:
      - multiple
    file: null
    description: "This paper describes a stakeholder-driven approach that combines
      climate projections and social-ecological models to develop
      fair,  climate-ready management scenarios for groundfish and crab
      fisheries in the eastern Bering Sea, showing that repeated, inclusive
      engagement  and a balanced mix of fixed limits and flexible targets help
      decision-makers understand tradeoffs and support equitable adaptation to
      climate change.     "
