    title: Predicting Pacific cod thermal spawning habitat in a changing climate
    icon: fa fa-book
    type: publication
    species:
      - pacific-cod
    file: null
    description: This study examines how warming temperatures are predicted to shift
      the thermal spawning habitat for Pacific cod in the Eastern Bering
      Sea,  finding that suitable habitat is expected to increase and shift
      northward, and highlights the need to integrate experimental data with
      climate models  to understand the impacts of warming temperatures on fish
      life histories under climate change.
