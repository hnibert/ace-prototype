    icon: fa fa-book
    type: publication
    species: []
    file: null
    description: This study evaluates the initial MOM6-NEP hindcast simulation
      against long-term biophysical mooring observations on the Bering
      shelf,  identifies the physical processes contributing to model biases,
      and improves the shear-driven turbulent mixing scheme used in
      MOM6-NEP.  With these improvements, MOM6-NEP successfully reproduces the
      observed mean spatial pattern and interannual variability of the Bering
      Sea shelf bottom "cold pool"  and extreme conditions of ice distribution,
      increasing confidence in the model's ability to simulate historical ocean
      conditions and predict their future changes.
