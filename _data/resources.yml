  #Resource
- title: "Aligning fisheries terminology with diverse social benefits"
  date: 2024-09-28
  type: "publication"
  icon: "fa fa-book"
  regions:
  - "eastern-bering-sea"
  communities: []
  themes:
  - "human-dimensions"
  species:
  - "multiple"
  audience:
  - "fishery-mangers"
  topics:
  - "fisheries-management"
  authors:
  - "sarah-wise"
  user-goals:
  - "understand-community-impacts"
  description:  >-
    Fisheries management categories such as "commercial" and "recreational" overlook key social, cultural, and food-system benefits of fishing, as well as non-market economies. 
    While "subsistence", which is used in state and federal management contexts in Alaska, could offer a more flexible framework, careful, data-informed accounting is needed to 
    ensure that benefits are equitably recognized and to strengthen community resilience and national benefits under growing climate and social pressures.
  url: "https://www.sciencedirect.com/science/article/pii/S0308597X24003750"
  is-available: true
  file: null

