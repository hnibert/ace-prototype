    url: https://www.sciencedirect.com/science/article/pii/S0308597X24003750
    title: Aligning fisheries terminology with diverse social benefits
    icon: fa fa-book
    type: publication
    species:
      - multiple
    file: null
    description: Fisheries management categories such as "commercial" and
      "recreational" overlook key social, cultural, and food-system benefits of
      fishing, as well as non-market economies.  While "subsistence", which is
      used in state and federal management contexts in Alaska, could offer a
      more flexible framework, careful, data-informed accounting is needed
      to  ensure that benefits are equitably recognized and to strengthen
      community resilience and national benefits under growing climate and
      social pressures.
