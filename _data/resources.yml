    title: Capturing uncertainty when modelling environmental drivers of fish
      populations, with an illustrative application to Pacific Cod in the
      eastern Bering Sea
    icon: fa fa-book
    type: publication
    species:
      - pacific-cod
    file: null
    description: This study presents a framework for accounting for multiple
      uncertainties in stock assessments, applied to Pacific cod in the eastern
      Bering Sea, showing that climate-driven changes,  particularly in
      recruitment, can lead to declines in biomass and catch under current
      harvest control rules, while adjusting for environmental scenarios may
      help maintain stock levels  and long-term profitability.
