entries:
  - title: "Pacific Cod Species Distribution Model Explorer: Dutch Harbor, Alaska"
    author: "maurice-goodman"
    species: "Pacific Cod"
    location: "Dutch Harbor, Alaska"

    version: 1.0
    languages:
      - R
      - Shiny
    description: >-
      This application displays future projections from species distribution models (SDMs) for the Bering Sea. 
      SDMs combine environmental and species data to project where species may occur under different climate scenarios. 
      Explore how Pacific cod distribution in proximity to Dutch Harbor, Alaska may change under low- and high-emissions futures.

    #leave blank if you want to link to a dedicated internal page (the url is generated by jekyll) otherwise use this in combination with render: false, layout: null above
    external_url: "https://gis.psmfc.org/portal/apps/dashboards/e544fa5fde8f4231994bc3738cf742e6"

    #download url: a link to a downloadable shiny app, quarto file or anything else related to this app
    download_url: null
    download_size: null

